{{define "content"}}
<div class="page-head">
  <h1 class="page-title">Koneksi gagal</h1>
  <p class="page-desc">Database tidak dapat diakses saat ini.</p>
</div>

<section class="card">
  <div class="card-body stack">
    <div class="alert alert-warning" role="alert">
      <span class="alert-icon">{{template "icon" (dict "Name" "alert")}}</span>
      <div class="alert-content">
        <p class="alert-title">Koneksi ke database gagal</p>
        <p class="alert-desc">Database <span class="mono">{{.ConnectionName}}</span> tidak dapat dicapai. Periksa
          kembali konfigurasi koneksi atau coba lagi nanti.</p>
      </div>
    </div>

    <p class="mt-4">
      <a class="btn btn-primary" href="/databases/{{.CurrentDB}}/schema">Coba lagi</a>
    </p>
  </div>
</section>
{{end}}
