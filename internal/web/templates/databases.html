{{/*
Halaman Daftar Database.
Data: web.DatabasesPage (lihat databases.go): .Cards, .Empty
*/}}
{{define "content"}}
<link rel="stylesheet" href="/static/css/pages/databases.css">
<div class="db-page">
    <h1 class="db-page__title">Daftar Database</h1>

    {{if .Cards}}
    <div class="db-grid">
        {{range .Cards}}{{template `db-card` .}}{{end}}
    </div>
    {{else}}
    <p class="db-page__empty">{{or .Empty `Belum ada database yang bisa diakses.`}}</p>
    {{end}}
</div>
{{end}}
