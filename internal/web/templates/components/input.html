{{/*
Komponen input field. Dipanggil lewat `dict`:

{{template `input` (dict `Label` `Email` `Name` `email` `Placeholder` `nama@contoh.com`)}}

Parameter (semua opsional):
Label teks label di atas field
Name, ID name & id input (ID default = Name, dipakai juga untuk <label for>)
    Type "text" (default) | "email" | "password" | "number" | dst
    Value nilai awal. Kosong -> placeholder tampil (neutral-500), terisi -> teks neutral-900
    Placeholder teks placeholder
    Helper teks bantuan di bawah field
    Error pesan error. OPSIONAL: kalau kosong/tidak diisi -> state normal & pesan tidak muncul.
    Kalau diisi -> field jadi merah dan pesan ini menggantikan Helper.
    State "default" (default) | "disabled"
    Required true -> atribut required
    IconLeft nama icon di kiri (lihat components/icon.html)
    IconRight nama icon di kanan
    Class class tambahan
    Attrs atribut mentah, mis. (attr `autocomplete="email" hx-post="/x"`)

    CATATAN: string di dalam tag HTML pakai backtick (`...`), jangan "..." (lihat button.html).
    */}}

    {{define "input"}}
    {{- $id := or .ID .Name -}}
    <div class="{{template `input-class` .}}">
        {{- with .Label}}<label class="input__label" for="{{$id}}">{{.}}</label>{{end}}
        <div class="input__box">
            {{- with .IconLeft}}{{template `icon` .}}{{end}}
            <input class="input__control" type="{{or .Type `text`}}" {{with $id}} id="{{.}}" {{end}}{{with .Name}}
                name="{{.}}" {{end}}{{with .Value}} value="{{.}}" {{end}}{{with .Placeholder}} placeholder="{{.}}"
                {{else}} placeholder=" " {{end}}{{if eq (or .State `default`) `disabled`}} disabled{{end}}{{if
                .Required}} required{{end}}{{if .Error}} aria-invalid="true" {{end}}{{if or .Error .Helper}}
                aria-describedby="{{$id}}-msg" {{end}}{{with .Attrs}} {{.}}{{end}}>
            {{- with .IconRight}}{{template `icon` .}}{{end}}
            {{- if .PasswordToggle}}
            <button type="button" class="input__toggle" data-password-toggle aria-pressed="false"
                aria-label="Tampilkan password" {{if eq (or .State `default`) `disabled`}} disabled{{end}}>
                {{- template `icon` `eye-slash`}}{{template `icon` `eye` -}}
            </button>
            {{- end}}
        </div>
        {{- if .Error}}
        <p class="input__helper" id="{{$id}}-msg" role="alert">{{.Error}}</p>
        {{- else if .Helper}}
        <p class="input__helper" id="{{$id}}-msg">{{.Helper}}</p>
        {{- end}}
    </div>
    {{end}}

    {{define "input-class" -}}
    input
    {{- if .Error}} is-error{{end}}
    {{- if eq (or .State `default`) `disabled`}} is-disabled{{end}}
    {{- with .Class}} {{.}}{{end}}
    {{- end}}
