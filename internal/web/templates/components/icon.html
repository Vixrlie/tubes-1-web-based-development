{{/*
Icon inline (stroke = currentColor, jadi ikut warna teks/tombol).
Pemakaian: {{template "icon" "heart"}}
Tambah icon baru = tambah satu cabang `else if` di bawah.

Daftar: heart, plus, arrow-right, check,
user, users, link, database, table, migration
*/}}
{{define "icon"}}
<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
    stroke-linejoin="round" aria-hidden="true" focusable="false">
    {{- if eq . `heart`}}
    <path
        d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
    {{- else if eq . `plus`}}
    <path d="M5 12h14M12 5v14" />
    {{- else if eq . `arrow-right`}}
    <path d="M5 12h14m-7-7 7 7-7 7" />
    {{- else if eq . `check`}}
    <path d="M20 6 9 17l-5-5" />
    {{- else if eq . `user`}}
    <circle cx="12" cy="8" r="5" />
    <path d="M20 21a8 8 0 0 0-16 0" />
    {{- else if eq . `users`}}
    <path d="M18 21a8 8 0 0 0-16 0" />
    <circle cx="10" cy="8" r="5" />
    <path d="M22 20c0-3.37-2-6.5-4-8a5 5 0 0 0-.45-8.3" />
    {{- else if eq . `link`}}
    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71" />
    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71" />
    {{- else if eq . `database`}}
    <ellipse cx="12" cy="5" rx="9" ry="3" />
    <path d="M3 5v14a9 3 0 0 0 18 0V5" />
    <path d="M3 12a9 3 0 0 0 18 0" />
    {{- else if eq . `table`}}
    <circle cx="4" cy="12" r="2" />
    <path d="M6 12h4M10 6v12M10 6h3M10 12h3M10 18h3" />
    <circle cx="16" cy="6" r="2" />
    <circle cx="16" cy="12" r="2" />
    <circle cx="16" cy="18" r="2" />
    {{- else if eq . `migration`}}
    <path d="M20 7h-3a2 2 0 0 1-2-2V2" />
    <path d="M9 18a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h7l4 4v10a2 2 0 0 1-2 2Z" />
    <path d="M3 7.6v12.8A1.6 1.6 0 0 0 4.6 22h9.8" />
    {{- end}}
</svg>
{{end}}
