{{define "content"}}
<h1>Kelola Group</h1>
<p><a href="/">Beranda</a> | <a href="/admin/users">Kelola user</a> | <a href="/admin/groups/new">Buat group</a></p>
{{if .Notice}}<p role="status">{{.Notice}}</p>{{end}}
<table>
    <thead>
        <tr>
            <th>Nama</th>
            <th>Anggota</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {{range .Groups}}
        <tr>
            <td>{{.Name}}</td>
            <td>{{.MemberCount}}</td>
            <td><a href="/admin/groups/{{.ID}}">Ubah</a></td>
        </tr>
        {{else}}
        <tr>
            <td colspan="3">Belum ada group.</td>
        </tr>
        {{end}}
    </tbody>
</table>
{{end}}
